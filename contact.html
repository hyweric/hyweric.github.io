<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Eric Hou about electrical engineering, robotics, and embedded systems."
    />
    <title>Contact — Eric Hou</title>
    <link rel="icon" href="assets/croppedimg.png" type="image/png" />
    <link rel="stylesheet" href="assets/css/portfolio.css?v=5" />
  </head>
  <body id="top">
    <header class="site-header">
      <a class="wordmark" href="index.html">Eric Hou</a
      ><button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html#skills">Skills</a><a href="projects.html">Projects</a
        ><a href="contact.html">Contact</a
        ><a href="assets/docs/Eric-Hou-Resume.pdf">Resume</a>
      </nav>
    </header>
    <main class="simple-page shell">
      <section class="contact-section" aria-labelledby="contact-title">
        <div class="contact-intro">
          <p class="eyebrow">Contact</p>
          <h1 id="contact-title">Get in touch.</h1>
          <p>
            For engineering opportunities, research, or project conversations,
            send me a note.
          </p>
        </div>
        <form
          class="contact-card"
          action="https://formspree.io/f/mgeggrzw"
          method="post"
        >
          <div class="contact-recipient">
            <span>To</span
            ><a href="mailto:hyweric@gmail.com">hyweric@gmail.com</a>
          </div>
          <label
            ><span>From</span
            ><input
              type="email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
          /></label>
          <label
            ><span>Subject</span
            ><input
              type="text"
              name="subject"
              required
              placeholder="What are you working on?"
          /></label>
          <label
            ><span>Message</span
            ><textarea
              name="message"
              rows="6"
              required
              placeholder="Let's connect!"
            ></textarea>
          </label>
          <button class="send-button" type="submit">
            Send message <span aria-hidden="true">↗</span>
          </button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <a class="footer-mark" href="index.html">Eric Hou</a>
      <div class="footer-links">
        <a href="mailto:hyweric@gmail.com">Email</a
        ><a href="https://www.linkedin.com/in/erichou2007/">LinkedIn</a
        ><a href="https://github.com/hyweric">GitHub</a>
      </div>
      <a class="back-to-top" href="#top">Back to top ↑</a>
    </footer>
    <script src="assets/js/portfolio.js?v=5"></script>
  </body>
</html>
